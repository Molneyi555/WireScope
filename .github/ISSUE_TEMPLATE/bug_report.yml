name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach private HAR, PCAP, JSONL, tokens, cookies, or unredacted URLs.
  - type: input
    id: version
    attributes:
      label: WireScope version
      placeholder: Output of wirescope --version
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS and Python versions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true

