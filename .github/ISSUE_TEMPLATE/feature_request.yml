name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What diagnostic or analysis workflow is currently difficult?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and success criteria
      description: What observable data would support the result, and how would we know the feature works?
    validations:
      required: true
  - type: dropdown
    id: privilege
    attributes:
      label: Does this require elevated privileges?
      options:
        - "No"
        - Maybe
        - "Yes"
  - type: dropdown
    id: privacy
    attributes:
      label: Could this collect additional sensitive data?
      options:
        - "No"
        - Maybe
        - "Yes"
    validations:
      required: true
